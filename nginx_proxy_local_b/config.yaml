---
version: 4.5.1-local.4
hassio_api: true
slug: nginx_proxy_local_b
name: NGINX proxy (local nightly build, B)
description: The official NGINX proxy add-on, built on this Yellow every night so Alpine's security fixes land within a day. Source of truth is the home repo, addons/nginx_proxy_local.
url: https://github.com/home-assistant/addons/tree/master/nginx_proxy
arch:
  - aarch64
init: false
map:
  - ssl
  - share
options:
  domain: null
  hsts: max-age=31536000; includeSubDomains
  certfile: fullchain.pem
  keyfile: privkey.pem
  cloudflare: false
  use_ssl_backend: false
  client_max_body_size_megabytes: 1
  customize:
    active: false
    default: nginx_proxy_default*.conf
    servers: nginx_proxy/*.conf
  real_ip_from: []
ports:
  443/tcp: 443
  443/udp: null
  80/tcp: null
schema:
  domain: str
  hsts: str
  certfile: str
  keyfile: str
  cloudflare: bool
  use_ssl_backend: bool
  client_max_body_size_megabytes: int(0,)
  customize:
    active: bool
    default: str
    servers: str
  real_ip_from:
    - str
