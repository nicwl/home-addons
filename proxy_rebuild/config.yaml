---
name: Proxy nightly maintenance
version: 1.3.0
slug: proxy_rebuild
description: One-shot, started nightly by a Home Assistant automation. Warns before the proxy's Alpine branch reaches end of life, flags changes to the official NGINX add-on upstream, and when Alpine has published new packages builds the idle member of the blue/green proxy pair, verifies it, and swaps it in. A failed build changes nothing; yesterday's build keeps serving. Never starts the official add-on. Source of truth is the home repo, addons/proxy_rebuild.
arch:
  - aarch64
startup: application
boot: manual
init: false
hassio_api: true
homeassistant_api: true
hassio_role: manager
options:
  proxy_a: dda86250_nginx_proxy_local
  proxy_b: dda86250_nginx_proxy_local_b
  alpine_branch: v3.24
  upstream_commit: e4cf624a7f5bf9a934177bb894adac12380043c9
  force_rebuild: false
schema:
  proxy_a: str
  proxy_b: str
  alpine_branch: str
  upstream_commit: str
  force_rebuild: bool
